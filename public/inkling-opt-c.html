<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inkling — Option C, Manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Sans:wght@500;600;700;800&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3ecdf; --ink:#1c1810; --muted:#8a7f70; --faint:#b6ab99;
    --rule:#2a2419; --rule-soft:rgba(40,32,18,.18);
    --spark:#f0531f;
    --serif:"Fraunces",Georgia,serif; --sans:"Noto Sans",sans-serif; --mono:"Noto Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1500px;height:960px;font-family:var(--sans);color:var(--ink);overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
  .mast{display:flex;align-items:center;justify-content:space-between;padding:24px 52px;border-bottom:1.5px solid var(--rule)}
  .wm{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em}
  .wm .d{color:var(--spark)}
  .nav{display:flex;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .nav a{padding:0 18px;display:flex;align-items:center;border-left:1px solid var(--rule-soft)}
  .nav a:last-child{color:var(--ink)}

  .body{flex:1;padding:0 52px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .eyebrow{position:absolute;top:40px;left:52px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
  .eyebrow .sq{width:9px;height:9px;background:var(--spark)}
  h1{font-family:var(--serif);font-weight:500;font-size:104px;line-height:.93;letter-spacing:-.04em;max-width:1180px}
  h1 .sp{color:var(--spark)}
  h1 .it{font-style:italic;font-weight:400}
  .sub{font-size:18px;line-height:1.5;color:#403a30;max-width:520px;margin-top:30px;font-weight:500;font-family:var(--sans)}

  .strip{display:flex;align-items:stretch;border-top:1.5px solid var(--rule)}
  .strip .lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    padding:0 20px;display:flex;align-items:center;border-right:1.5px solid var(--rule)}
  .strip .film{flex:1;display:flex}
  .strip .film img{width:118px;height:84px;object-fit:cover;border-right:1px solid var(--rule-soft);display:block}
  .strip .pal{display:flex;width:300px;border-left:1.5px solid var(--rule)}
  .strip .pal span{flex:1}
  .strip .go{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--paper);background:var(--ink);padding:0 24px}
  .strip .go .a{color:var(--spark)}
</style>
</head>
<body>
  <div class="mast">
    <div class="wm">inkling<span class="d">.</span></div>
    <nav class="nav"><a>Gather</a><a>Play</a><a>Build</a><a>Open the studio →</a></nav>
  </div>
  <div class="body">
    <div class="eyebrow"><span class="sq"></span>Inkling — a studio for trusting your eye</div>
    <h1>The eye that <span class="it">saved</span><br>all of this <span class="sp">already knows.</span></h1>
    <p class="sub">Inkling reads the thread running through everything you’ve gathered, and pulls it into a brand direction — yours, start to finish.</p>
  </div>
  <div class="strip">
    <span class="lbl">Pulled<br>from 31</span>
    <div class="film">
      <img src="/sample/1039135314045106233.jpg" alt="">
      <img src="/sample/1039135314045106132.jpg" alt="">
      <img src="/sample/1039135314045106197.jpg" alt="">
      <img src="/sample/1039135314045106159.jpg" alt="">
    </div>
    <div class="pal">
      <span style="background:#94495d"></span><span style="background:#9cbcd9"></span><span style="background:#bc9e90"></span>
      <span style="background:#6f8a63"></span><span style="background:#f0531f"></span><span style="background:#1c1810"></span>
    </div>
    <span class="go">Start gathering <span class="a">→</span></span>
  </div>
</body>
</html>
