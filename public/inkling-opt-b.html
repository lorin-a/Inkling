<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inkling — Option B, Specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Noto+Sans:wght@500;600;700;800&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3ecdf; --ink:#1c1810; --muted:#8a7f70; --faint:#b6ab99;
    --rule:#2a2419; --rule-soft:rgba(40,32,18,.18);
    --spark:#6a2ee6;
    --serif:"Fraunces",Georgia,serif; --sans:"Noto Sans",sans-serif; --mono:"Noto Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1500px;height:960px;font-family:var(--sans);color:var(--ink);overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
  .mast{display:flex;align-items:center;justify-content:space-between;padding:24px 52px;border-bottom:1.5px solid var(--rule)}
  .wm{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em}
  .wm .d{color:var(--spark)}
  .nav{display:flex;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .nav a{padding:0 18px;display:flex;align-items:center;border-left:1px solid var(--rule-soft)}
  .nav a:last-child{color:var(--ink)}

  .titleband{display:flex;align-items:baseline;justify-content:space-between;padding:18px 52px;border-bottom:1.5px solid var(--rule)}
  .titleband .k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .titleband .k b{color:var(--spark)}
  .titleband .h{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.02em}
  .titleband .h em{color:var(--spark);font-style:italic}

  .sheet{flex:1;display:grid;grid-template-columns:repeat(3,1fr)}
  .plate{display:flex;flex-direction:column;border-right:1.5px solid var(--rule)}
  .plate:last-child{border-right:none}
  .pimg{flex:1;overflow:hidden;position:relative;border-bottom:1.5px solid var(--rule)}
  .pimg img{width:100%;height:100%;object-fit:cover;display:block}
  .pimg .no{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:#fff;mix-blend-mode:difference}
  .pal{display:flex;height:42px}
  .pal span{flex:1;border-right:1px solid rgba(255,255,255,.22)}
  .cap{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1.5px solid var(--rule)}
  .cap .nm{font-family:var(--serif);font-size:18px;font-weight:500}
  .cap .ct{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}

  .foot{display:flex;align-items:center;justify-content:space-between;padding:22px 52px}
  .foot .s{font-family:var(--serif);font-size:19px;font-weight:500;max-width:640px;letter-spacing:-.01em}
  .go{display:inline-flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--paper);background:var(--ink);padding:14px 22px}
  .go .a{color:var(--spark)}
</style>
</head>
<body>
  <div class="mast">
    <div class="wm">inkling<span class="d">.</span></div>
    <nav class="nav"><a>Gather</a><a>Play</a><a>Build</a><a>Open the studio →</a></nav>
  </div>
  <div class="titleband">
    <span class="k">Inkling — colour specimen / <b>No. 01</b></span>
    <span class="h">Pull the brand out of the <em>references.</em></span>
  </div>
  <div class="sheet">
    <div class="plate">
      <div class="pimg"><img src="/sample/1039135314045106233.jpg" alt=""><span class="no">PLATE 01</span></div>
      <div class="pal"><span style="background:#b0476a"></span><span style="background:#e0a24a"></span><span style="background:#6f8a63"></span><span style="background:#d8c4a4"></span><span style="background:#2d2418"></span></div>
      <div class="cap"><span class="nm">Coastal field</span><span class="ct">5 inks</span></div>
    </div>
    <div class="plate">
      <div class="pimg"><img src="/sample/1039135314045106132.jpg" alt=""><span class="no">PLATE 02</span></div>
      <div class="pal"><span style="background:#9cbcd9"></span><span style="background:#5a7d6f"></span><span style="background:#b89a6a"></span><span style="background:#2f3a36"></span></div>
      <div class="cap"><span class="nm">Still water</span><span class="ct">4 inks</span></div>
    </div>
    <div class="plate">
      <div class="pimg"><img src="/sample/1039135314045106159.jpg" alt=""><span class="no">PLATE 03</span></div>
      <div class="pal"><span style="background:#94495d"></span><span style="background:#bc9e90"></span><span style="background:#5c3f30"></span><span style="background:#9cbcd9"></span><span style="background:#6a2ee6"></span></div>
      <div class="cap"><span class="nm">Open ground</span><span class="ct">5 inks</span></div>
    </div>
  </div>
  <div class="foot">
    <span class="s">Three references, three directions. You decide which one is yours.</span>
    <span class="go">Start a specimen <span class="a">→</span></span>
  </div>
</body>
</html>
