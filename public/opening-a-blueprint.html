<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inkling — A · Blueprint Specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,300..600&family=Young+Serif&family=Space+Grotesk:wght@300..700&family=Archivo+Black&family=Borel&family=DM+Mono:wght@300;400;500&family=Noto+Sans:wght@100..900&family=Noto+Sans+Mono:wght@400..700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/opening-core.js"></script>
<style>
  :root{ --bg:#f3f1ea; --ink:#1b1710; --sub:#5f5546; --muted:#6a5e4c; --faint:#9a8e78; --accent:#4b3f73; --line:rgba(40,32,18,.16);
    --blue:rgba(75,63,115,.5); --taste:#c4795a;
    --serif:"Fraunces",Georgia,serif; --sans:"Noto Sans",system-ui,sans-serif; --mono:"Noto Sans Mono",ui-monospace,monospace; --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;
    cursor:crosshair;transition:background-color .8s var(--ease)}
  .sheet{position:absolute;inset:30px;border:1.5px solid var(--ink)}
  /* corner registration marks */
  .reg{position:absolute;width:22px;height:22px;pointer-events:none}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--ink)}
  .reg::before{width:22px;height:1.5px} .reg::after{width:1.5px;height:22px}
  .reg.tl{top:-1px;left:-1px} .reg.tr{top:-1px;right:-1px} .reg.tr::before{right:0} .reg.tr::after{right:0}
  .reg.bl{bottom:-1px;left:-1px} .reg.bl::before{bottom:0} .reg.bl::after{bottom:0}
  .reg.br{bottom:-1px;right:-1px} .reg.br::before{bottom:0;right:0} .reg.br::after{bottom:0;right:0}
  .shtTop{position:absolute;top:18px;left:26px;right:26px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

  /* the specimen */
  .spec{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);display:flex;justify-content:center}
  .metric{position:absolute;left:60px;right:60px;height:0;border-top:1px dashed var(--blue);pointer-events:none}
  .metric span{position:absolute;left:-2px;top:-9px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:var(--bg);padding:0 5px}
  .metric.solid{border-top:1.5px solid var(--accent)} .metric.solid span{color:var(--accent)}
  .stencil{position:relative;z-index:2;font-family:var(--serif);font-weight:600;font-size:clamp(96px,15vw,210px);line-height:1;letter-spacing:-.04em;white-space:nowrap}
  .word{position:relative;display:inline-block}
  .out{display:inline-block;white-space:nowrap;padding:.24em .2em .44em;color:transparent;-webkit-text-stroke:2.2px rgba(40,32,18,.5)}
  .fill{position:absolute;inset:0;white-space:nowrap;padding:.24em .2em .44em;color:var(--taste)}
  .mark{position:relative;top:.165em;display:inline-block;margin-left:-.02em;cursor:pointer;line-height:0;vertical-align:baseline;color:var(--accent)}
  .mark svg{display:block;width:.2em;height:.2em;overflow:visible}

  .legend{position:absolute;left:60px;bottom:120px;display:flex;flex-direction:column;gap:10px}
  .legend .lt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .mats{display:flex;gap:9px}
  .sw{width:34px;height:34px;border-radius:3px;border:1.5px solid rgba(40,32,18,.3);cursor:grab;padding:0;touch-action:none;transition:transform .15s}
  .sw:hover{transform:translateY(-3px)} .sw:active{cursor:grabbing}
  .swGhost{position:fixed;width:40px;height:40px;border-radius:4px;pointer-events:none;z-index:60;transform:translate(-50%,-50%);box-shadow:0 8px 20px rgba(0,0,0,.3);border:2px solid #fff}

  /* title block — bottom-right, like a drawing sheet */
  .titleBlock{position:absolute;right:54px;bottom:54px;width:300px;border:1.5px solid var(--ink);font-family:var(--mono);font-size:11px;background:var(--bg)}
  .tbRow{display:grid;grid-template-columns:84px 1fr;border-bottom:1px solid var(--line)}
  .tbRow:last-child{border-bottom:none}
  .tbK{padding:7px 9px;border-right:1px solid var(--line);color:var(--faint);letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
  .tbV{padding:7px 9px;color:var(--ink);font-weight:600;letter-spacing:.02em}
  .tbV.big{font-family:var(--serif);font-size:15px;letter-spacing:0}
  .tbCtl{display:flex;gap:7px;flex-wrap:wrap;padding:8px 9px}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer}
  .pill:hover,.pill.on{border-color:var(--ink);color:var(--ink)}
  .hintTL{position:absolute;left:60px;bottom:60px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
  <div class="sheet">
    <span class="reg tl"></span><span class="reg tr"></span><span class="reg bl"></span><span class="reg br"></span>
    <div class="shtTop"><span>Inkling — Idea → Inspiration → Identity</span><span>Sheet 01 / Opening · Specimen</span></div>

    <div class="spec" id="spec">
      <div class="metric" id="mCap"><span>cap-height</span></div>
      <div class="metric" id="mX"><span>x-height</span></div>
      <div class="metric solid" id="mBase"><span>baseline</span></div>
      <div class="stencil" id="stencil" aria-label="inkling.">
        <span class="word" id="word"><span class="out" aria-hidden="true">inkling</span><span class="fill" id="fill" aria-hidden="true">inkling</span></span><span class="mark" id="mark" role="button" tabindex="0" aria-label="Change the mark"></span>
      </div>
    </div>

    <div class="legend">
      <span class="lt">Materials — drag to apply</span>
      <div class="mats" id="tray"></div>
    </div>
    <div class="hintTL">know it when you see it.</div>

    <div class="titleBlock" id="tb">
      <div class="tbRow"><span class="tbK">Project</span><span class="tbV big">inkling.</span></div>
      <div class="tbRow"><span class="tbK">Typeface</span><span class="tbV" id="tbFace">Fraunces · Editorial</span></div>
      <div class="tbRow"><span class="tbK">Weight</span><div class="tbCtl"><input type="range" id="weight" min="200" max="800" step="10" value="600" style="width:150px;accent-color:var(--accent)"><span class="tbV" id="tbW" style="padding:0">600</span></div></div>
      <div class="tbRow"><span class="tbK">Accent</span><span class="tbV" id="tbAccent">#4B3F73</span></div>
      <div class="tbRow"><span class="tbK">Surface</span><div class="tbCtl" id="surfaceRow"></div></div>
      <div class="tbRow"><span class="tbK">Mark</span><div class="tbCtl" id="markRow"></div></div>
    </div>
  </div>

<script>
  const I=window.INK;
  const stencil=document.getElementById('stencil'),word=document.getElementById('word'),fill=document.getElementById('fill'),out=document.querySelector('.out'),
        mark=document.getElementById('mark'),tray=document.getElementById('tray'),surfaceRow=document.getElementById('surfaceRow'),markRow=document.getElementById('markRow'),
        weight=document.getElementById('weight'),tbW=document.getElementById('tbW'),tbFace=document.getElementById('tbFace'),tbAccent=document.getElementById('tbAccent'),
        mCap=document.getElementById('mCap'),mX=document.getElementById('mX'),mBase=document.getElementById('mBase'),spec=document.getElementById('spec');
  let faceI=0,markI=0;
  const hasGsap=typeof gsap!=='undefined';
  function setMark(){ mark.innerHTML=I.MARKS[markI]; markRow.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('on',i===markI)); }
  if(hasGsap){ gsap.set(fill,{clipPath:'inset(100% 0 0 0)'}); gsap.set(out,{clipPath:'inset(0 0 0 0)'}); } else fill.style.clipPath='inset(100% 0 0 0)';
  function pour(hex){ fill.style.color=hex; document.documentElement.style.setProperty('--taste',hex); document.body.style.backgroundColor='color-mix(in srgb,'+hex+' 5%, #f3f1ea)';
    out.style.webkitTextStrokeColor='var(--ink)'; tbAccent.textContent=hex.toUpperCase();
    if(hasGsap){ gsap.fromTo(fill,{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:1,ease:'power2.inOut'}); gsap.to(out,{clipPath:'inset(0 0 100% 0)',duration:1,ease:'power2.inOut'}); }
    else { fill.style.clipPath='inset(0 0 0 0)'; out.style.clipPath='inset(0 0 100% 0)'; } }
  function setFace(i){ faceI=(i+I.FACES.length)%I.FACES.length; stencil.style.fontFamily=I.FACES[faceI][0]; tbFace.textContent=I.FACES[faceI][1==1?0:0].replace(/"/g,'').split(',')[0]+' · '+I.FACES[faceI][1]; positionMetrics(); }
  function cycleMark(){ markI=(markI+1)%I.MARKS.length; setMark(); }

  // position the cap/x/baseline rules using real font metrics
  function positionMetrics(){
    const cs=getComputedStyle(stencil); const fpx=parseFloat(cs.fontSize);
    const ctx=document.createElement('canvas').getContext('2d'); ctx.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const asc=ctx.measureText('H').actualBoundingBoxAscent||fpx*0.7;
    const xh=ctx.measureText('x').actualBoundingBoxAscent||fpx*0.48;
    const or=out.getBoundingClientRect(); const sr=spec.getBoundingClientRect();
    const baselineY = or.top - sr.top + fpx*0.24 + (ctx.measureText('inkling').fontBoundingBoxAscent);
    mBase.style.top=baselineY+'px'; mX.style.top=(baselineY-xh)+'px'; mCap.style.top=(baselineY-asc)+'px';
  }

  I.TASTE.forEach(hex=>{ const b=document.createElement('button'); b.className='sw'; b.type='button'; b.style.background=hex; b.setAttribute('aria-label','Apply '+hex);
    let d=null;
    b.addEventListener('pointerdown',e=>{ d={x:e.clientX,y:e.clientY,m:false,g:null}; try{b.setPointerCapture(e.pointerId);}catch(_){} });
    b.addEventListener('pointermove',e=>{ if(!d)return; if(!d.m&&Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)>5){ d.m=true; const g=document.createElement('div'); g.className='swGhost'; g.style.background=hex; document.body.appendChild(g); d.g=g; } if(d.g){ d.g.style.left=e.clientX+'px'; d.g.style.top=e.clientY+'px'; } });
    const end=e=>{ if(!d)return; if(d.g)d.g.remove(); if(d.m){ const r=stencil.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) pour(hex); } else pour(hex); d=null; };
    b.addEventListener('pointerup',end); b.addEventListener('pointercancel',()=>{ if(d&&d.g)d.g.remove(); d=null; });
    tray.appendChild(b); });
  I.SURFACES.forEach(([k,l],i)=>{ const b=document.createElement('button'); b.className='pill'+(i===0?' on':''); b.type='button'; b.textContent=l;
    b.addEventListener('click',()=>{ document.body.style.backgroundSize = k==='grid'?'30px 30px':k==='dots'?'40px 40px':'40px 40px';
      surfaceRow.querySelectorAll('.pill').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }); surfaceRow.appendChild(b); });
  I.MARKS.forEach((svg,i)=>{ const b=document.createElement('button'); b.className='pill'; b.type='button'; b.style.cssText='width:26px;height:26px;font-size:120px;line-height:0;display:flex;align-items:center;justify-content:center;padding:0;color:var(--accent)';
    b.innerHTML=svg.replace('<svg','<svg style="width:.2em;height:.2em"'); b.addEventListener('click',()=>{ markI=i; setMark(); }); markRow.appendChild(b); });

  setMark(); setFace(0);
  weight.addEventListener('input',e=>{ stencil.style.fontWeight=e.target.value; tbW.textContent=e.target.value; positionMetrics(); });
  mark.addEventListener('click',cycleMark); mark.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();cycleMark();} });
  window.addEventListener('resize',positionMetrics);
  setTimeout(positionMetrics,300);
</script>
</body>
</html>
